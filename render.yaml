services:
  - type: web
    name: codesentinel
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
    disk:
      name: codesentinel-db-data
      mountPath: /app/data
      sizeGB: 1
